<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angļu valoda</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--ink:#222;--mute:#777;--acc:#f5b800;--acc2:#6c3fc5;--ok:#2e9e5b;--bad:#d64545;--line:#eadfc4}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--acc);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:0;background:#ffffff80;padding:8px 14px;border-radius:20px;font-size:15px;cursor:pointer}
nav button.on{background:var(--acc2);color:#fff}
main{max-width:720px;margin:0 auto;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.big{font-size:34px;font-weight:700;text-align:center;margin:18px 0}
.sub{color:var(--mute);text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
button.b{border:0;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer;background:var(--acc2);color:#fff}
button.b.alt{background:#eee;color:var(--ink)}
button.b.ok{background:var(--ok)} button.b.bad{background:var(--bad)}
button.b.y{background:var(--acc);color:#222}
input[type=text],textarea{width:100%;padding:12px;font-size:18px;border:2px solid var(--line);border-radius:12px;font-family:inherit}
textarea{min-height:120px;font-size:16px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.pill{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:14px}
.txt{font-size:20px;line-height:1.9;white-space:pre-wrap}
#pop{max-height:60vh;overflow:auto}
#ps{margin:6px 0 10px;color:#444;white-space:pre-wrap;font-size:16px}
.txt span.w{cursor:pointer;border-radius:4px;padding:0 1px}
.txt span.w:hover{background:#fde9a0}
.txt span.known{border-bottom:2px dotted var(--ok)}
#pop{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--acc2);padding:16px;box-shadow:0 -4px 20px #0003;display:none}
#pop .in{max-width:720px;margin:0 auto}
#pop .wd{font-size:24px;font-weight:700}
#pop .tr{font-size:20px;margin:6px 0 10px;color:var(--acc2)}
.msg{white-space:pre-line;text-align:center;font-size:18px;margin:8px 0;min-height:26px}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)}
.list button{display:block;width:100%;text-align:left;margin-bottom:8px}
small.hint{color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>🇬🇧 Angļu valoda</h1>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="pop"><div class="in">
  <div class="wd" id="pw"></div><div class="tr" id="pt"></div><div id="ps"></div>
  <div class="row" style="justify-content:flex-start">
    <button class="b alt" id="pspeak">🔊</button>
    <button class="b alt" id="psent">📝 Teikums</button>
    <button class="b y" id="padd">＋ Pievienot kartītēm</button>
    <button class="b alt" id="pclose">Aizvērt</button>
  </div>
</div></div>

const STORIES=[{"id": "fox", "t": "The Fox and the Grapes", "l": "A2", "s": "A hungry fox was walking through a garden. High on a branch he saw some big, purple grapes. \"What a lovely lunch,\" he thought. He jumped, but he could not reach them. He jumped again and again. At last he was tired. He sat down and looked at the grapes for a long time. Then he stood up and walked away. \"Those grapes are probably sour,\" he said. \"I do not want them anyway.\""}, {"id": "tortoise", "t": "The Tortoise and the Hare", "l": "A2", "s": "A hare laughed at a slow tortoise. \"I can run much faster than you,\" he said. \"Let us have a race,\" said the tortoise. The animals came to watch. The hare ran very fast and soon he was far ahead. He was sure he could win, so he lay down under a tree and went to sleep. The tortoise walked slowly and never stopped. When the hare woke up, the tortoise was almost at the end. The hare ran as fast as he could, but it was too late. The tortoise won the race."}, {"id": "lionmouse", "t": "The Lion and the Mouse", "l": "A2", "s": "A lion was sleeping in the forest when a small mouse ran over his face. The lion woke up and caught the mouse. \"Please let me go,\" said the mouse. \"One day I will help you.\" The lion laughed, but he opened his hand. A few days later, hunters caught the lion in a strong net. He could not move. The little mouse heard him cry and came quickly. She cut the ropes with her teeth, and the lion was free. \"Now you see,\" said the mouse, \"even a small friend can be a big help.\""}, {"id": "morning", "t": "A Busy Morning", "l": "A2", "s": "Anna wakes up at six o'clock. She takes a quick shower and makes coffee. She is always late, so she does not have time for breakfast. She puts her laptop and her keys in her bag and runs to the bus stop. The bus is full this morning. She stands next to a man with a big umbrella because it is raining. At work, she meets her friend Tom in the kitchen. \"You look tired,\" he says. \"I am,\" says Anna. \"I have a long day, and I need another cup of coffee.\""}, {"id": "phone", "t": "The Lost Phone", "l": "A2", "s": "Mark cannot find his phone. He looks in his bag, in his jacket and under the bed. He asks his sister, \"Have you seen my phone?\" She says, \"No, but call it.\" Mark has no other phone, so he borrows hers. He hears a small sound from the kitchen. The phone is in the fridge, next to the milk! Mark remembers that he was talking on it while he was making breakfast. His sister laughs. \"You forget everything,\" she says. Mark smiles and puts the phone in his pocket. \"Next time,\" he says, \"I will look in the fridge first.\""}, {"id": "doctor", "t": "At the Doctor", "l": "A2", "s": "Lisa has a bad cough and a headache. She decides to see a doctor. The doctor's office is small and quiet. A nurse asks her name and gives her a form. After ten minutes, the doctor calls her in. \"How long have you felt ill?\" she asks. \"About three days,\" says Lisa. The doctor listens to her chest and checks her temperature. \"You have a cold,\" she says. \"You need to rest, drink a lot of water and stay at home.\" She writes a note for Lisa's boss. Lisa says thank you and goes home to bed."}, {"id": "wolf", "t": "The Boy Who Cried Wolf", "l": "A2", "s": "A young shepherd looked after sheep on a hill near a village. He was bored, so he decided to play a trick. \"Wolf! Wolf!\" he shouted. The villagers ran up the hill, but there was no wolf. The boy laughed. He did it again the next day, and again people came to help. One evening a real wolf came. \"Wolf! Wolf!\" cried the boy. This time nobody came, because they thought he was lying again. The wolf took many sheep. The boy was very sad. He learned that people do not believe someone who lies."}, {"id": "rain", "t": "A Rainy Weekend", "l": "A2", "s": "It rains all weekend, so Peter and his daughter stay at home. On Saturday they bake a cake. They forget the sugar, so the cake is not sweet, but they eat it with honey. In the afternoon they play cards and listen to music. On Sunday the sun comes out for an hour, and they go for a short walk. The streets are wet and quiet. They see a small dog in a yellow coat. At home they make soup and watch a film. \"This was a good weekend,\" says his daughter. \"Even with the rain.\""}, {"id": "ant", "t": "The Ant and the Grasshopper", "l": "B1", "s": "All summer the grasshopper sang and played in the sun. His neighbour, the ant, worked hard every day. She carried food to her nest and stored it for winter. \"Why do you work so much?\" asked the grasshopper. \"Come and enjoy the weather!\" \"I am preparing for winter,\" said the ant. \"You should do the same.\" The grasshopper only laughed. When winter came, the fields were covered with snow. The grasshopper was cold and hungry, and he had nothing to eat. He went to the ant's door and asked for help. The ant gave him a little food, but she also said, \"Next summer, remember this winter.\""}, {"id": "newjob", "t": "A New Job", "l": "B1", "s": "On her first day at the new company, Elena arrived twenty minutes early. She felt nervous, but everyone was friendly. Her manager showed her the office and introduced her to the team. \"Don't worry about learning everything today,\" he said. \"Just ask questions.\" Elena received a laptop, a password and a long list of people to meet. By lunchtime her head was full of names. In the afternoon she sat with a colleague who explained how the main system worked. It was confusing, but interesting. When she left, she was exhausted, yet she felt happy. She had a good feeling about this job."}, {"id": "mice", "t": "The Town Mouse and the Country Mouse", "l": "B1", "s": "A town mouse visited his cousin in the country. The country mouse offered simple food: bread, nuts and a little cheese. \"Is this all you have?\" asked the town mouse. \"Come to the city with me. You will eat like a king.\" In the city, the table was full of delicious food. But just as they began to eat, a big cat came into the room. The mice ran away and hid in a hole, shaking with fear. \"I am going home,\" said the country mouse. \"I would rather eat simple food in peace than have a feast in danger.\""}, {"id": "train", "t": "Missing the Train", "l": "B1", "s": "Daniel ran along the platform, but the train was already leaving. He had an important meeting in another city, and the next train was in two hours. He called his colleague to explain the situation. \"Don't worry,\" she said. \"We will move the meeting to the afternoon.\" Daniel sat in a café and ordered a coffee. He realised that he had left home late because he had stayed up working until midnight. He decided to change his habits. On the next train he finally relaxed and read a book. The meeting went well, and nobody was angry."}, {"id": "goose", "t": "The Goose with the Golden Eggs", "l": "B1", "s": "A farmer had a goose that laid one golden egg every day. He sold the eggs and became rich. But he wanted more. \"Why wait for one egg a day?\" he thought. \"Inside the goose there must be a lot of gold.\" So he killed the goose and cut it open. To his surprise, there was no gold inside. It was an ordinary goose, like any other. The farmer had lost his lucky goose and all the golden eggs. He sat down and cried. From that day on, he understood that greed can destroy what we already have."}, {"id": "mountains", "t": "A Trip to the Mountains", "l": "B1", "s": "Last summer, we spent a week in the mountains. We stayed in a small wooden house near a lake. Every morning we got up early and went hiking. The air was clean, and the views were amazing. On the third day, the weather changed suddenly. Dark clouds covered the sky, and it began to rain heavily. We had to turn back and walk quickly down the path. We were wet and cold when we reached the house, but the owner gave us hot tea and fresh bread. That evening, we laughed about it. It was the best holiday we have ever had."}, {"id": "woodcutter", "t": "The Honest Woodcutter", "l": "B1", "s": "A poor woodcutter dropped his axe into a deep river. He sat on the bank and began to cry because he could not afford a new one. Suddenly a spirit appeared with a golden axe. \"Is this yours?\" it asked. \"No,\" said the woodcutter. The spirit showed him a silver axe. \"No,\" he said again. Finally it held up his old iron axe. \"Yes, that is mine,\" he said happily. The spirit was impressed by his honesty and gave him all three axes. When a greedy neighbour heard the story, he tried the same trick, but the spirit was not fooled."}, {"id": "moving", "t": "Moving to a New City", "l": "B1", "s": "Moving to a new city is exciting, but it is also stressful. When Nina arrived, she knew nobody. She rented a small flat, bought some furniture and spent the first weekend exploring the old town. She found it difficult to make friends at first. Then she joined a language class and a running club. Slowly, the city started to feel like home. She learned which cafés were cheap, which streets were quiet and which bus was always late. After six months, she realised she no longer needed a map. \"I have a life here now,\" she thought."}, {"id": "windsun", "t": "The North Wind and the Sun", "l": "B2", "s": "The North Wind and the Sun argued about which of them was stronger. They saw a traveller walking along the road, wrapped in a heavy coat. \"Let us see who can make him take it off,\" said the Sun. The Wind agreed and blew with all his strength. But the harder he blew, the tighter the traveller held his coat. At last the Wind gave up. Then the Sun began to shine gently. Soon the traveller felt warm, then hot, and finally he took off his coat and sat in the shade. The Wind had to admit that kindness is often more effective than force."}, {"id": "decision", "t": "A Difficult Decision", "l": "B2", "s": "Marta had been offered a better job in another country, and she had one week to decide. The salary was higher, and the position was exactly what she had always wanted. However, she would have to leave her family and friends behind. She made a list of advantages and disadvantages, but it did not help. She talked to her sister, who simply said, \"Which choice would you regret more?\" That question stayed in her mind all night. In the morning, Marta realised that she was more afraid of staying than of leaving. She picked up the phone and accepted the offer."}, {"id": "bear", "t": "The Two Travellers and the Bear", "l": "B2", "s": "Two friends were travelling through a forest when a bear suddenly appeared on the path. One of them quickly climbed a tree, leaving his companion alone. The other man had no time to escape, so he lay on the ground and pretended to be dead. The bear sniffed around his head, then slowly walked away. When it was safe, the first friend came down. \"What did the bear whisper in your ear?\" he asked. \"It said I should never trust a friend who abandons me in danger,\" answered the other. After that day, their friendship was never the same."}, {"id": "complaint", "t": "The Customer Complaint", "l": "B2", "s": "The customer walked into the service centre looking furious. \"I brought my car here three days ago,\" he said, \"and the problem still hasn't been fixed.\" The receptionist listened carefully and apologised. She explained that a spare part had arrived late, which had delayed the repair. \"I understand your frustration,\" she said. \"I can offer you a replacement car until yours is ready, and we will not charge you for the extra days.\" The man's expression softened. He had expected an argument, not a solution. He thanked her, signed the form and left, a little calmer than when he had arrived."}, {"id": "sons", "t": "The Old Man and His Sons", "l": "B2", "s": "An old man had several sons who were always quarrelling. One day he called them together and gave each of them a stick. \"Break it,\" he said. They did so easily. Then he tied a bundle of sticks together and asked them to break that. Each son tried with all his strength, but nobody could do it. \"You see,\" said the father, \"alone, you are weak, and anyone can defeat you. But if you stay united, you will be strong.\" The sons looked at one another and felt ashamed. From then on they supported each other, and the family prospered."}, {"id": "homework", "t": "Working from Home", "l": "B2", "s": "At first, working from home sounded perfect. There was no commute, no noisy open-plan office and unlimited coffee. But after a few weeks, Jonas noticed problems. He worked longer hours because the office was always just a few steps away, and he rarely spoke to anyone except his cat. To regain control, he set clear rules for himself: start at nine, finish at five, take a proper lunch break. He also began to work from a café twice a week. Gradually, he found a balance. \"The key,\" he told a friend, \"is to treat home as a workplace, but not as a prison.\""}, {"id": "reflection", "t": "The Dog and His Reflection", "l": "B2", "s": "A dog was carrying a large piece of meat across a bridge when he saw his reflection in the water below. He thought it was another dog with an even bigger piece of meat. Greedily, he opened his mouth to grab it. As soon as he did, his own meat fell into the river and disappeared. The dog stared at the empty water. There was nothing left, neither the real meat nor the imaginary one. He walked home hungry and ashamed, having learned that wanting too much can cost you everything you already have."}, {"id": "powercut", "t": "The Power Cut", "l": "B2", "s": "At eight o'clock in the evening, the whole street went dark. For a moment nobody understood what was happening, and then neighbours began to come out of their houses with candles and torches. Somebody said that a storm had damaged the power lines. The mobile networks were also down, so people could not call the electricity company. Instead of complaining, they began to talk to each other. Someone brought out a guitar, and a few children started to sing. When the lights finally came back after three hours, a few people were almost disappointed. It had been the most sociable evening in years."}];

const KEY='eng.v1';
let S = JSON.parse(localStorage.getItem(KEY)||'null') || {cards:{},days:{}};
DECK.forEach(([en,lv,l])=>{ if(!S.cards[en]) S.cards[en]={en,lv,lvl:l,ef:2.5,int:0,reps:0,due:0}; else if(!S.cards[en].lvl) S.cards[en].lvl=l; });
DECK.forEach(([en,lv])=>{const c=S.cards[en];if(c&&c.lv!==lv)c.lv=lv;}); // tulkojumu labojumi nonāk arī esošajās kartītēs
if(!S.v3){S.levels=['A2','B1','B2','C1'];S.npd=20;S.v3=1;}
if(!S.levels)S.levels=['A2','B1','B2','C1'];
if(!S.npd)S.npd=20;
const active=c=>!c.lvl||(S.levels||['A2','B1','B2','C1']).includes(c.lvl);
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const today=()=>new Date().toISOString().slice(0,10);
const dayStat=()=>S.days[today()]||(S.days[today()]={new:0,done:0});
const NEW_PER_DAY=()=>S.npd||20;

/* ============ SM-2 ============ */
function grade(c,q){ // q: 0 = vēlreiz, 3 = grūti, 4 = labi, 5 = viegli
  if(q<3){c.reps=0;c.int=0;c.due=Date.now()+10*60000;}
  else{
    if(c.reps===0)c.int=1; else if(c.reps===1)c.int=3; else c.int=Math.round(c.int*c.ef);
    if(q===5)c.int=Math.ceil(c.int*1.3);
    c.reps++;
    c.ef=Math.max(1.3,c.ef+0.1-(5-q)*(0.08+(5-q)*0.02));
    c.due=Date.now()+c.int*864e5;
  }
  dayStat().done++; save();
}
const dueCards=()=>Object.values(S.cards).filter(c=>c.reps>0&&c.due<=Date.now());
const LR={A2:1,B1:2,B2:3,C1:4};
function hsh(s){let x=2166136261;for(const ch of s){x^=ch.charCodeAt(0);x=Math.imul(x,16777619);}return x>>>0;}
// jaunie vārdi: pēc līmeņa (A2→C1), bet katrā līmenī tēmas jauktas
const newCards=()=>Object.values(S.cards).filter(c=>c.reps===0&&c.due===0&&active(c)).sort((a,b)=>((LR[a.lvl]||0)-(LR[b.lvl]||0))||(hsh(a.en)-hsh(b.en)));
const HARD_N=2; // cik reizes "Nezinu" vienā dienā = vārds ir grūts un atgriežas nākamās dienas jaunajos vārdos
// grūtie vārdi no iepriekšējām dienām tiek pievienoti šodienas jaunajiem (max puse no dienas limita)
function adoptCarry(){
  const d=dayStat();
  const cs=Object.values(S.cards).filter(c=>c.reps===0&&c.cd&&c.cd<today()).sort((a,b)=>a.cd<b.cd?-1:1).slice(0,Math.max(1,Math.floor(NEW_PER_DAY()/2)));
  cs.forEach(c=>{delete c.cd;if(!(d.learn=d.learn||[]).includes(c.en)){d.learn.push(c.en);d.new++;}(d.carried=d.carried||[]).push(c.en);});
  if(cs.length)save();
}
function buildQueue(){
  adoptCarry();
  const d=dayStat();
  const left=Math.max(0,NEW_PER_DAY()+(d.extra||0)-d.new);
  const learn=(d.learn||[]).map(e=>S.cards[e]).filter(c=>c&&c.reps===0&&c.cd!==today());
  return [...dueCards(), ...learn, ...newCards().slice(0,left)];
}

/* ============ AUDIO ============ */
let voice=null;
function pickVoice(){
  const v=speechSynthesis.getVoices();
  voice=v.find(x=>/en-(GB|US)/i.test(x.lang)&&/Google|Natural|Online/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text,rate=0.9){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; if(voice)u.voice=voice; u.rate=rate;
  speechSynthesis.speak(u);
}

const $=s=>document.querySelector(s);
const app=$('#app');
function h(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==='class')e.className=v; else if(k.startsWith('on'))e[k]=v; else e.setAttribute(k,v);
  }
  kids.flat().forEach(k=>e.append(k.nodeType?k:document.createTextNode(k)));
  return e;
}
const norm=s=>s.toLowerCase().trim().replace(/[^a-z' ]/g,'').replace(/\s+/g,' ');
function statsBar(){
  const d=dayStat();
  return h('div',{class:'stats'},
    h('span',{class:'pill'},'Atkārtojami: '+dueCards().length),
    h('span',{class:'pill'},'Jauni (mācāmie) šodien: '+d.new+'/'+(NEW_PER_DAY()+(d.extra||0))),
    h('span',{class:'pill'},'Šodien izdarīts: '+d.done),
    h('span',{class:'pill'},'Kopā kartīšu: '+Object.keys(S.cards).length));
}

/* ============ 1) KARTĪTES ============ */
function viewCards(){
  const q=buildQueue();
  const xp=new Map(); // cik reizes šajā sesijā mācāmais vārds jau redzēts
  app.append(statsBar());
  app.append(h('div',{class:'row'},h('button',{class:'b y',onclick:triage},'⚡ Ātrā atlase (20 vārdi)')));
  const todayL=(dayStat().learn||[]).map(e=>S.cards[e]).filter(Boolean);
  const lastL=Object.values(S.cards).filter(c=>c.ft).sort((a,b)=>b.ft-a.ft).slice(0,30);
  app.append(h('div',{class:'row'},
    h('button',{class:'b alt',onclick:()=>repeatPass(todayL,'Šodienas vārdi')},'🔁 Šodienas vārdi ('+todayL.length+')'),
    h('button',{class:'b alt',onclick:()=>repeatPass(lastL,'Pēdējie '+lastL.length+' vārdi')},'🔁 Pēdējie 30')));
  if(!q.length){app.append(h('div',{class:'box'},h('div',{class:'big'},'🎉 Šodien viss!'),h('div',{class:'sub'},'Dienas limits sasniegts. Vari atkārtot vārdus (🔁), turpināt ar vēl jauniem vārdiem vai doties uz testiem.'),h('div',{class:'row'},h('button',{class:'b',onclick:()=>{const d=dayStat();d.extra=(d.extra||0)+20;save();go('cards');}},'➕ Vēl 20 jaunu vārdu šodien'),h('button',{class:'b alt',onclick:()=>go('test')},'✍️ Uz testu'))));return;}
  const box=h('div',{class:'box'}); app.append(box);
  function show(){
    box.innerHTML='';
    if(!q.length){go('cards');return;}
    const c=q[0];
    const isNew=c.reps===0&&c.due===0;
    const learning=c.reps===0;
    const x=xp.get(c)||0;
    if(learning)box.append(h('div',{class:'sub'},((dayStat().carried||[]).includes(c.en)?'↩️ Grūtais vārds no iepriekšējās dienas · ':'')+'Mācāmais vārds — atkārtojums '+(x+1)+' no 3'));
    box.append(h('div',{class:'big'},c.en));
    box.append(h('div',{class:'row'},h('button',{class:'b alt',onclick:()=>say(c.en)},'🔊 Klausīties'),h('button',{class:'b alt',onclick:()=>say(c.en,0.55)},'🐢 Lēnāk')));
    const ans=h('div',{class:'row'});
    box.append(ans);
    ans.append(h('button',{class:'b',onclick:reveal},'Rādīt atbildi'));
    if(isNew)ans.append(h('button',{class:'b y',onclick:()=>{c.reps=3;c.int=30;c.due=Date.now()+30*864e5;dayStat().done++;save();q.shift();show();}},'Zinu jau ✓'));
    say(c.en);
    function reveal(){
      ans.innerHTML='';
      box.insertBefore(h('div',{class:'big',style:'color:var(--acc2)'},c.lv),ans);
      const ex=(SENTS[c.en]||[])[0];
      if(ex)box.insertBefore(h('div',{class:'sub',style:'cursor:pointer',onclick:()=>say(ex[0])},'🔊 '+ex[0]),ans);
      const firstSeen=()=>{const d=dayStat();if(isNew){d.new++;c.due=1;(d.learn=d.learn||[]).push(c.en);save();}};
      // mācāmajiem vārdiem: Nezinu / Zinu
      const know=ok=>()=>{
        firstSeen();q.shift();
        if(!ok){c.hn=(c.hn||0)+1;xp.set(c,0);q.splice(Math.min(2,q.length),0,c);save();}
        else{
          const nx=x+1;
          if(nx<3){xp.set(c,nx);q.splice(Math.min(nx===1?4:10,q.length),0,c);save();}
          else{
            if(!c.ft)c.ft=Date.now();
            if((c.hn||0)>=HARD_N){c.cd=today();c.due=1;dayStat().done++;} // grūts: atgriezīsies rīt jauno vārdu sarakstā
            else grade(c,4);
            delete c.hn;save();
          }
        }
        show();
      };
      // atkārtojamajiem vārdiem: Vēlreiz / Grūti / Labi / Viegli
      const rate=(qv)=>()=>{
        q.shift();
        grade(c,qv);
        if(qv<3){xp.set(c,1);q.splice(Math.min(3,q.length),0,c);}
        show();
      };
      if(learning)ans.append(h('button',{class:'b bad',onclick:know(false)},'Nezinu'),h('button',{class:'b ok',onclick:know(true)},'Zinu'));
      else ans.append(h('button',{class:'b bad',onclick:rate(0)},'Vēlreiz'),h('button',{class:'b alt',onclick:rate(3)},'Grūti'),h('button',{class:'b ok',onclick:rate(4)},'Labi'),h('button',{class:'b y',onclick:rate(5)},'Viegli'));
    }
  }
  show();
}

// Atkārtošana: pārskata jau mācītos vārdus (izruna + nozīme), neietekmē SM-2 grafiku
function repeatPass(cards,title){
  app.innerHTML='';
  const box=h('div',{class:'box'});app.append(box);
  if(!cards.length){box.append(h('div',{class:'sub'},'Šeit vēl nav vārdu — vispirms iemācies dažus kartītēs.'),h('div',{class:'row'},h('button',{class:'b alt',onclick:()=>go('cards')},'← Atpakaļ')));return;}
  const q=cards.slice().sort(()=>Math.random()-0.5);
  const total=q.length;let seen=0;
  function show(){
    box.innerHTML='';
    if(!q.length){
      box.append(h('div',{class:'big'},'✅ Atkārtots'),h('div',{class:'sub'},title+': '+total+' vārdi. Visi šie vārdi ir iekļauti testos.'),
        h('div',{class:'row'},h('button',{class:'b',onclick:()=>go('test')},'✍️ Uz testu'),h('button',{class:'b alt',onclick:()=>repeatPass(cards,title)},'🔁 Vēlreiz'),h('button',{class:'b alt',onclick:()=>go('cards')},'Kartītes')));
      return;
    }
    const c=q[0];
    box.append(h('div',{class:'sub'},'🔁 '+title+' · atlicis '+q.length+' no '+total));
    box.append(h('div',{class:'big'},c.en));
    box.append(h('div',{class:'row'},h('button',{class:'b alt',onclick:()=>say(c.en)},'🔊 Klausīties'),h('button',{class:'b alt',onclick:()=>say(c.en,0.55)},'🐢 Lēnāk')));
    const ans=h('div',{class:'row'});box.append(ans);
    ans.append(h('button',{class:'b',onclick:reveal},'Rādīt nozīmi'));
    say(c.en);
    function reveal(){
      ans.innerHTML='';
      box.insertBefore(h('div',{class:'big',style:'color:var(--acc2)'},c.lv),ans);
      const ex=(SENTS[c.en]||[])[0];
      if(ex)box.insertBefore(h('div',{class:'sub',style:'cursor:pointer',onclick:()=>say(ex[0])},'🔊 '+ex[0]),ans);
      ans.append(
        h('button',{class:'b bad',onclick:()=>{q.shift();q.splice(Math.min(3,q.length),0,c);show();}},'Vēlreiz vēlāk'),
        h('button',{class:'b ok',onclick:()=>{q.shift();c.miss=Math.max(0,(c.miss||0));seen++;show();}},'Atceros'));
    }
  }
  show();
}

// Ātrā atlase: pieskaries tikai tiem vārdiem, ko NEZINI. Zināmie tiek izlaisti (nesaskaitās dienas limitā).
function triage(){
  app.innerHTML='';
  const batch=newCards().slice(0,20);
  const box=h('div',{class:'box'});app.append(box);
  if(!batch.length){box.append(h('div',{class:'sub'},'Izvēlētajos līmeņos jaunu vārdu vairs nav.'),h('div',{class:'row'},h('button',{class:'b alt',onclick:()=>go('cards')},'← Atpakaļ')));return;}
  const unk=new Set();
  box.append(h('div',{class:'sub'},'Pieskaries vārdiem, kurus NEZINI (parādīsies tulkojums). Pārējie tiks atzīmēti kā zināmi un nāks retos atkārtojumos.'));
  const grid=h('div',{style:'display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0'});
  const paint=(t,c)=>{const u=unk.has(c.en);t.textContent=u?c.en+' — '+c.lv:c.en;t.style.border='2px solid '+(u?'var(--bad)':'var(--ok)');t.style.background=u?'#fdeaea':'#eaf7ef';};
  batch.forEach(c=>{
    const t=h('button',{class:'b alt',style:'padding:14px 8px;text-align:center'},c.en);
    paint(t,c);
    t.onclick=()=>{if(unk.has(c.en))unk.delete(c.en);else{unk.add(c.en);say(c.en);}paint(t,c);};
    grid.append(t);
  });
  box.append(grid);
  box.append(h('div',{class:'row'},
    h('button',{class:'b ok',onclick:()=>{
      const d=dayStat();
      batch.forEach(c=>{
        if(unk.has(c.en)){c.due=1;d.new++;(d.learn=d.learn||[]).push(c.en);}
        else{c.reps=3;c.int=30;c.due=Date.now()+30*864e5;}
      });
      d.done+=batch.length-unk.size;save();go('cards');
    }},'Gatavs'),
    h('button',{class:'b alt',onclick:()=>go('cards')},'Atcelt')));
}

/* ============ TESTS (rakstīšana) ============ */
const dia=s=>s.toLowerCase().trim().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}' ]/gu,'').replace(/\s+/g,' ');
function stemMatch(a,b){ // pieņem citu galotni: garlaicīgi ~ garlaicīgs
  if(Math.min(a.length,b.length)<5)return false;
  let i=0; while(i<a.length&&i<b.length&&a[i]===b[i])i++;
  return i>=4&&a.length-i<=2&&b.length-i<=2&&i>=Math.min(a.length,b.length)-2;
}
const MASTER=3;
const RET=[3,5,8,12]; // pēc cik kārtām apgūtais vārds atgriežas (katru reizi retāk)
const isMastered=(c,d)=>(c['ts'+d]||0)>=MASTER&&((S.rounds||0)-(c['mr'+d]||0))<RET[Math.min(c['mt'+d]||0,RET.length-1)];
const SENT_N=30;
const learnedCards=()=>Object.values(S.cards).filter(c=>(c.reps>0||c.due>0)&&active(c));
const rndOf=a=>a[Math.floor(Math.random()*a.length)];
function pickItems(cards,dirs,size,ignoreMastery){
  const byCard=[];
  cards.forEach(c=>{
    const ps=[];
    dirs.forEach(d=>{
      if(d==='se'){const ss=SENTS[c.en]||[];if(!ss.length)return;if(ignoreMastery||!isMastered(c,d))ps.push({c,d,s:rndOf(ss)});}
      else if(ignoreMastery||!isMastered(c,d))ps.push({c,d});
    });
    if(ps.length)byCard.push(ps);
  });
  if(!byCard.length)return ignoreMastery?[]:pickItems(cards,dirs,size,true);
  const key=x=>Math.random()-(x.c.miss||0)*0.3;
  const first=[],extra=[];
  byCard.forEach(ps=>{ps.sort(()=>Math.random()-0.5);first.push(ps[0]);extra.push(...ps.slice(1));});
  first.forEach(x=>x.k=key(x));extra.forEach(x=>x.k=key(x));
  first.sort((a,b)=>a.k-b.k);extra.sort((a,b)=>a.k-b.k);
  const pick=[...first,...extra].slice(0,size).sort(()=>Math.random()-0.5);
  return pick.map(x=>({c:x.c,d:x.d,s:x.s,retry:false}));
}
function resetMastery(){Object.values(S.cards).forEach(c=>{['lv','en','sp','se'].forEach(d=>{delete c['ts'+d];delete c['mr'+d];delete c['mt'+d];});});save();}
// Kopīga "kārta": jautājumi ar beigām un rezultātu. ask(it,box,report,next) uzzīmē jautājumu.
function runSession(box,items,ask,again,menu){
  const total=items.length,queue=items.slice();
  let n=0,good=0;const wrong=[],mast=[],back=[];
  const report=it=>ok=>{
    if(it.retry)return;
    n++;
    const d=it.d,k='ts'+d,c=it.c;
    if(ok){
      good++;const before=c[k]||0;c.miss=Math.max(0,(c.miss||0)-1);
      if(before>=MASTER){c['mt'+d]=(c['mt'+d]||0)+1;c['mr'+d]=S.rounds||0;back.push(c);}
      else{c[k]=before+1;if(c[k]>=MASTER){c['mr'+d]=S.rounds||0;c['mt'+d]=c['mt'+d]||0;mast.push(c);}}
    }else{c[k]=0;c.miss=(c.miss||0)+1;wrong.push(c);queue.push({c,d:it.d,m:it.m,s:it.s,retry:true});}
    grade(c,ok?4:0);
  };
  function step(){
    box.innerHTML='';
    if(!queue.length)return summary();
    const it=queue.shift();
    box.append(h('div',{class:'sub'},(it.retry?'Vēlreiz (kļūda): ':((it.c['ts'+it.d]||0)>=MASTER?'🔁 ':'')+'Vārds '+(n+1)+' no '+total+'  ·  ')+'pareizi: '+good));
    ask(it,box,report(it),step);
  }
  function summary(){
    box.innerHTML='';S.rounds=(S.rounds||0)+1;save();
    box.append(h('div',{class:'big'},good+' / '+total),h('div',{class:'sub'},'pareizi no pirmās reizes'));
    if(wrong.length)box.append(h('p',{},h('b',{},'Atkārto šos vārdus:')),h('div',{},wrong.map(c=>h('div',{style:'font-size:18px'},c.en+' — '+c.lv))));
    if(mast.length)box.append(h('p',{},h('b',{},'🏆 Apgūti (3 reizes pēc kārtas pareizi, vairs neprasīs): '),mast.map(c=>c.en).join(', ')));
    if(back.length)box.append(h('p',{},h('b',{},'🔁 Atkārtoti un joprojām zini (nākamreiz būs retāk): '),back.map(c=>c.en).join(', ')));
    box.append(h('div',{class:'row'},h('button',{class:'b',onclick:again},'Vēl viena kārta'),h('button',{class:'b alt',onclick:menu},'Izvēlne')));
  }
  step();
}

/* ============ RUNĀ (runas atpazīšana) ============ */
const NUMW={0:'zero',1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten'};
const HOM={one:['won'],two:['to','too'],four:['for'],eight:['ate'],no:['know'],write:['right'],see:['sea'],hear:['here'],buy:['by','bye'],red:['read'],read:['red','reed'],week:['weak'],night:['knight'],tea:['t'],meat:['meet'],new:['knew']};
const spNorm=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\b\d+\b/g,m=>NUMW[m]||m).replace(/\s+/g,' ').trim();
function spMatch(alts,target){
  const t=spNorm(target),hom=HOM[t]||[];
  return alts.some(a=>{const x=spNorm(a);return x===t||hom.includes(x)||(!t.includes(' ')&&x.split(' ').some(w=>w===t||hom.includes(w)));});
}
function viewSpeak(){
  app.append(statsBar());
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const box=h('div',{class:'box'}); app.append(box);
  if(!SR){box.append(h('div',{class:'sub'},'Šis pārlūks neatbalsta runas atpazīšanu. Izmanto Chrome vai Edge datorā (vai Chrome Android telefonā).'));return;}
  const L0=learnedCards(); const L=L0.length>=3?L0:Object.values(S.cards).filter(active);
  function recog(cb){
    const r=new SR(); r.lang='en-GB'; r.interimResults=false; r.maxAlternatives=5; r.continuous=false;
    let fin=false; const out=(e,a)=>{if(fin)return;fin=true;cb(e,a);};
    r.onresult=ev=>out(null,[...ev.results[0]].map(a=>a.transcript));
    r.onerror=ev=>out(ev.error||'error');
    r.onend=()=>out('no-speech');
    try{r.start();}catch(e){out('error');}
  }
  function menu(){
    box.innerHTML='';
    const open=L.filter(c=>!isMastered(c,'sp')).length;
    box.append(h('div',{class:'sub'},'Kārta = 10 vārdi. Vārds izkrīt, kad to 3 reizes pēc kārtas pasaki pareizi pirmajā mēģinājumā, un pēc 3–5 kārtām atkal atgriežas. Atlicis: '+open),h('div',{style:'height:10px'}));
    box.append(h('div',{class:'list'},
      h('button',{class:'b',onclick:()=>start('lv')},'🇱🇻 → 🎤  Redzu latviski, saku angliski'),
      h('button',{class:'b alt',onclick:()=>start('rep')},'🔊 → 🎤  Dzirdu un atkārtoju')));
    box.append(h('p',{class:'sub'},h('small',{class:'hint'},'Vajag Chrome/Edge, internetu un mikrofona atļauju. Lietotne pārbauda, vai runas atpazinējs tevi saprata: tas rāda, ka izruna ir saprotama, bet nav precīzs izrunas vērtējums.')));
    box.append(h('div',{class:'row'},h('button',{class:'b alt',onclick:()=>{resetMastery();go('speak');}},'Atiestatīt "apgūtos"')));
  }
  function start(m){const items=pickItems(L,['sp'],10);items.forEach(i=>i.m=m);runSession(box,items,ask,()=>start(m),menu);}
  function ask(it,box,report,next){
    const c=it.c; let tries=0,done=false;
    if('speechSynthesis' in window)speechSynthesis.cancel();
    if(it.m==='lv'){box.append(h('div',{class:'sub'},'Pasaki angliski'),h('div',{class:'big'},c.lv));}
    else{
      box.append(h('div',{class:'sub'},'Noklausies un atkārto'),h('div',{class:'big'},c.en),h('div',{class:'sub'},c.lv),
        h('div',{class:'row'},h('button',{class:'b alt',onclick:()=>say(c.en,0.8)},'🔊'),h('button',{class:'b alt',onclick:()=>say(c.en,0.5)},'🐢')));
      say(c.en,0.8);
    }
    const msg=h('div',{class:'msg'}),row=h('div',{class:'row'});
    const mic=h('button',{class:'b'},'🎤 Spied un runā');
    const after=()=>{row.innerHTML='';row.append(h('button',{class:'b',onclick:next},'Tālāk →'),h('button',{class:'b alt',onclick:menu},'Beigt'));};
    mic.onclick=()=>{
      if(done)return;
      if('speechSynthesis' in window)speechSynthesis.cancel();
      mic.disabled=true; msg.className='msg'; msg.textContent='🎙️ Klausos… runā tagad';
      recog((err,alts)=>{
        mic.disabled=false;
        if(err){
          msg.className='msg bad-t';
          msg.textContent=(err==='not-allowed'||err==='service-not-allowed')?'Atļauj mikrofonu pārlūkā (slēdzenes ikona adreses joslā).':err==='no-speech'?'Neko nedzirdēju, mēģini vēlreiz.':'Atpazīšana neizdevās ('+err+').';
          return;
        }
        tries++;
        if(spMatch(alts,c.en)){
          done=true; msg.className='msg ok-t'; msg.textContent='✅ Pareizi! '+c.en+'  (dzirdēju: "'+alts[0]+'")';
          report(tries===1); say(c.en,0.8); after();
        }else{
          msg.className='msg bad-t'; msg.textContent='❌ Dzirdēju: "'+alts[0]+'". Vajag: '+c.en+'  — mēģini vēlreiz';
          say(c.en,0.8);
        }
      });
    };
    const skip=h('button',{class:'b alt',onclick:()=>{if(done)return;done=true;msg.className='msg bad-t';msg.textContent='Atbilde: '+c.en;report(false);say(c.en,0.8);after();}},'Nezinu');
    row.append(mic,skip);
    box.append(msg,row);
  }
  menu();
}

/* ============ 3) LASI ============ */
const cache={};
function stems(w){
  const o=[w];
  if(w.endsWith('ies'))o.push(w.slice(0,-3)+'y');
  if(w.endsWith('es'))o.push(w.slice(0,-2));
  if(w.endsWith('s'))o.push(w.slice(0,-1));
  if(w.endsWith('ed')){o.push(w.slice(0,-2));o.push(w.slice(0,-1));}
  if(w.endsWith('ing')){o.push(w.slice(0,-3));o.push(w.slice(0,-3)+'e');}
  return o;
}
// Bieži sīkvārdi (bez interneta)
const FUNC={the:'(noteiktais artikuls, latviski netulko)',a:'(nenoteiktais artikuls, latviski netulko)',an:'(nenoteiktais artikuls, latviski netulko)',i:'es',you:'tu / jūs',he:'viņš',she:'viņa',it:'tas',we:'mēs',they:'viņi',me:'man / mani',him:'viņu / viņam',us:'mums / mūs',them:'viņus / viņiem',my:'mans',your:'tavs / jūsu',his:'viņa',its:'tā',our:'mūsu',their:'viņu',is:'ir',are:'ir',am:'esmu',was:'bija',were:'bija',be:'būt',been:'bijis',being:'esot',have:'būt / ir',has:'ir',had:'bija',do:'darīt (arī palīgvārds)',does:'(palīgvārds jautājumos)',did:'(pagātnes palīgvārds)',will:'(nākotnes palīgvārds)',would:'(nosacījuma palīgvārds)',can:'varēt',could:'varētu',should:'vajadzētu',must:'jābūt / vajag',may:'drīkstēt',might:'varbūt',not:'ne',in:'iekšā / -ā',on:'uz',at:'pie / plkst.',to:'uz / lai',of:'no / (piederība)',for:'priekš / uz',with:'ar',from:'no',by:'pie / ar',about:'par / apmēram',into:'iekšā',over:'pāri / virs',under:'zem',up:'augšā',down:'lejā',out:'ārā',off:'nost',and:'un',but:'bet',or:'vai',so:'tāpēc / tik',then:'tad',than:'nekā',this:'šis',that:'tas / ka',these:'šie',those:'tie',here:'šeit',there:'tur',what:'kas / ko',who:'kas',whom:'kam / ko',whose:'kura',where:'kur',when:'kad',why:'kāpēc',how:'kā',which:'kurš',all:'viss',some:'daži',any:'jebkāds',no:'nē / nekāds',each:'katrs',as:'kā / kad',if:'ja',too:'arī / pārāk',very:'ļoti',just:'tikko / tikai',more:'vairāk',most:'visvairāk',much:'daudz',many:'daudz',own:'pašu',other:'cits',such:'tāds',only:'tikai',also:'arī',now:'tagad',well:'labi',back:'atpakaļ',one:'viens',two:'divi',three:'trīs'};
async function mm(text){
  if(cache[text])return cache[text];
  try{
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,450))+'&langpair=en|lv');
    if(!r.ok)return {err:'Tulkošanas serviss atbildēja ar kļūdu ('+r.status+').'};
    const j=await r.json();
    const tr=(j.responseData&&j.responseData.translatedText)||'';
    if(/MYMEMORY WARNING/i.test(tr)||j.quotaFinished)return {err:'Šodienas bezmaksas tulkojumu limits ir izsmelts. Mēģini rīt.'};
    if(!tr)return {err:'Tulkojums netika atrasts.'};
    return cache[text]={tr};
  }catch(e){return {err:'Neizdevās sazināties ar tulkošanas servisu ('+(e&&e.message||'kļūda')+'). Pārbaudi internetu vai reklāmu bloķētāju.'};}
}
async function translate(w){
  for(const s of stems(w)){ if(S.cards[s])return {tr:S.cards[s].lv,base:s,local:true}; }
  if(FUNC[w])return {tr:FUNC[w],base:w,local:true,func:true};
  const m=await mm(w);
  return m.err?{tr:'⚠ '+m.err,base:w,local:false,error:true}:{tr:m.tr.toLowerCase(),base:w,local:false};
}
let cur=null,curSent=null;
const readSet=()=>S.read||(S.read={});
function nextStory(){
  return STORIES.filter(x=>!readSet()[x.id]).sort((a,b)=>((LR[a.l]||0)-(LR[b.l]||0))||(hsh(a.id)-hsh(b.id)))[0];
}
function openStory(x){
  openText(x.t,x.s,{label:'✔ Izlasīts — nākamais stāsts',done:()=>{readSet()[x.id]=true;save();const n=nextStory();n?openStory(n):go('read');}});
}
async function wiki(topic){
  const msg=$('#wmsg');msg.className='msg';msg.textContent='Meklēju…';
  try{
    const base='https://simple.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts&exintro=1&explaintext=1&exsentences=12&redirects=1&exlimit=8';
    const url=topic?base+'&generator=search&gsrlimit=8&gsrsearch='+encodeURIComponent(topic):base+'&generator=random&grnnamespace=0&grnlimit=8';
    const j=await (await fetch(url)).json();
    const pages=Object.values((j.query||{}).pages||{}).filter(p=>p.extract&&p.extract.length>350).sort((a,b)=>(a.index||0)-(b.index||0));
    if(!pages.length){msg.className='msg bad-t';msg.textContent='Nekas piemērots netika atrasts. Pamēģini citu tēmu.';return;}
    const p=pages[Math.floor(Math.random()*Math.min(pages.length,topic?4:pages.length))];
    openText(p.title,p.extract.replace(/\n{2,}/g,'\n').slice(0,1800),{label:'✔ Izlasīts — cits raksts',done:()=>{go('read');wiki(topic);}});
  }catch(e){msg.className='msg bad-t';msg.textContent='Neizdevās atvērt Wikipedia ('+(e&&e.message||'kļūda')+'). Pārbaudi internetu.';}
}
function viewRead(){
  const unread=STORIES.filter(x=>!readSet()[x.id]);
  const n=nextStory();
  const b1=h('div',{class:'box'},h('b',{},'📚 Stāsti angļu valodā'),h('p',{class:'sub'},'Izlasīti: '+(STORIES.length-unread.length)+' no '+STORIES.length));
  if(n)b1.append(h('div',{class:'row'},h('button',{class:'b',onclick:()=>openStory(n)},'▶ Nākamais: '+n.t+' ('+n.l+')')));
  else b1.append(h('div',{class:'sub'},'Visi iebūvētie stāsti izlasīti! Izmanto Wikipedia vai savu tekstu.'));
  const list=h('div',{class:'list'});unread.slice(0,8).forEach(x=>list.append(h('button',{class:'b alt',onclick:()=>openStory(x)},'📄 '+x.t+' · '+x.l)));
  b1.append(list);
  if(STORIES.length-unread.length>0)b1.append(h('div',{class:'row'},h('button',{class:'b alt',onclick:()=>{if(confirm('Atzīmēt visus stāstus kā neizlasītus?')){S.read={};save();go('read');}}},'Atiestatīt izlasītos')));
  const tp=h('input',{type:'text',placeholder:'tēma angliski, piem. cars, cooking, Latvia'});
  const b2=h('div',{class:'box'},h('b',{},'🌐 Simple English Wikipedia'),h('p',{class:'sub'},'Raksti vienkāršākā angļu valodā. Vajag internetu.'),tp,
    h('div',{class:'row'},h('button',{class:'b',onclick:()=>wiki(tp.value.trim())},'Atrast rakstu'),h('button',{class:'b alt',onclick:()=>wiki('')},'Nejaušs raksts')),h('div',{class:'msg',id:'wmsg'}));
  const ta=h('textarea',{placeholder:'Ielīmē savu angļu tekstu šeit…'});
  const b3=h('div',{class:'box'},h('b',{},'Savs teksts'),h('div',{style:'height:8px'}),ta,h('div',{class:'row'},h('button',{class:'b',onclick:()=>ta.value.trim()&&openText('Mans teksts',ta.value,{label:'✔ Pabeigts',done:()=>go('read')})},'Atvērt lasītājā')));
  app.append(b1,b2,b3);
}
function openText(title,text,opts){
  app.innerHTML='';
  const box=h('div',{class:'box'});
  box.append(h('div',{class:'row',style:'justify-content:space-between'},h('b',{},title),h('div',{},h('button',{class:'b alt',onclick:()=>say(text,0.8)},'🔊 Visu'),' ',h('button',{class:'b alt',onclick:()=>{$('#pop').style.display='none';go('read');}},'← Atpakaļ'))));
  const t=h('div',{class:'txt'});
  const sents=text.match(/[^.!?\n]+[.!?]*["']?\s*|\n+/g)||[text];
  sents.forEach(sn=>{
    const sentTxt=sn.trim();
    sn.split(/(\s+)/).forEach(tok=>{
      if(!tok||/^\s+$/.test(tok)){t.append(tok);return;}
      const m=tok.match(/^([^A-Za-z']*)([A-Za-z'][A-Za-z'-]*)(.*)$/);
      if(!m){t.append(tok);return;}
      const w=m[2].toLowerCase();
      const sp=h('span',{class:'w'+(stems(w).some(x=>S.cards[x]&&S.cards[x].reps>0)?' known':''),onclick:()=>popup(w,sentTxt)},m[2]);
      t.append(m[1],sp,m[3]);
    });
  });
  // frāzes tulkošana: atzīmē vairākus vārdus (velc ar peli/pirkstu)
  const selHandler=()=>setTimeout(()=>{
    const sel=window.getSelection();
    if(!sel||sel.isCollapsed||!sel.rangeCount)return;
    const r=sel.getRangeAt(0);
    const spans=[...t.querySelectorAll('span.w')].filter(sp=>r.intersectsNode(sp));
    if(spans.length<2||spans.length>40)return;
    popup(spans.map(sp=>sp.textContent).join(' '),null);
  },60);
  t.addEventListener('mouseup',selHandler);t.addEventListener('touchend',selHandler);
  box.append(t,h('small',{class:'hint'},'Uzspied uz vārda, lai redzētu tulkojumu. Lai tulkotu frāzi, atzīmē vairākus vārdus (velc ar peli vai pirkstu). Poga "Teikums" iztulko visu teikumu. Zaļa pasvītra = vārds, ko jau mācies.'));
  if(opts&&opts.done)box.append(h('div',{class:'row'},h('button',{class:'b ok',onclick:()=>{$('#pop').style.display='none';opts.done();}},opts.label)));
  app.append(box);
}
async function popup(text,sent){
  const phrase=/\s/.test(text.trim());
  $('#pw').textContent=text;$('#pt').textContent='…';$('#ps').textContent='';$('#pop').style.display='block';
  $('#psent').style.display=(!phrase&&sent)?'':'none';
  curSent=(!phrase&&sent)?sent:null;cur=null;
  say(text,0.8);
  let r;
  if(phrase){const m=await mm(text);r=m.err?{tr:'⚠ '+m.err,base:text.toLowerCase(),error:true}:{tr:m.tr,base:text.toLowerCase()};}
  else r=await translate(text.toLowerCase());
  cur={w:r.base,lv:r.tr,bad:!!r.error||!!r.func};
  $('#pt').textContent=r.tr+(r.local&&r.base!==text.toLowerCase()&&!r.func?'  (no: '+r.base+')':'');
  $('#padd').textContent=S.cards[r.base]?'✔ Jau kartītēs':'＋ Pievienot kartītēm';
}
$('#pspeak').onclick=()=>say($('#pw').textContent,0.7);
$('#pclose').onclick=()=>$('#pop').style.display='none';
$('#psent').onclick=async()=>{
  if(!curSent)return;
  $('#ps').textContent='…';
  const m=await mm(curSent);
  $('#ps').textContent=curSent+'\n→ '+(m.err?'⚠ '+m.err:m.tr);
};
$('#padd').onclick=()=>{
  if(!cur||cur.bad||S.cards[cur.w])return;
  S.cards[cur.w]={en:cur.w,lv:cur.lv,ef:2.5,int:0,reps:0,due:0};save();
  $('#padd').textContent='✔ Pievienots!';
};

/* ============ 4) VĒL ============ */
function viewMore(){
  const ta=h('textarea',{placeholder:'Ielīmē rezerves kopiju (JSON), lai atjaunotu…'});
  const lvs=['A1','A2','B1','B2','C1'];
  S.levels=S.levels||['A2','B1','B2','C1'];
  const sets=h('div',{class:'box'},h('b',{},'Līmeņi un tempo'),h('p',{class:'sub'},'Kuri vārdi parādās kā jauni:'));
  const rowL=h('div',{class:'row'});
  lvs.forEach(l=>{const cb=h('input',{type:'checkbox'});cb.checked=S.levels.includes(l);cb.onchange=()=>{S.levels=lvs.filter(x=>x===l?cb.checked:S.levels.includes(x));save();};rowL.append(h('label',{style:'font-size:18px'},cb,' '+l+' ('+DECK.filter(d=>d[2]===l).length+')'));});
  const n=h('input',{type:'number',min:'1',max:'100',style:'width:90px;font-size:18px;padding:8px;border:2px solid var(--line);border-radius:10px'});
  n.value=S.npd||10; n.onchange=()=>{S.npd=Math.max(1,Math.min(100,+n.value||10));save();};
  sets.append(rowL,h('div',{class:'row'},'Jauni vārdi dienā: ',n));
  app.append(sets);
  // sinonīmu iestatījumi
  const synBox=h('div',{class:'box'});app.append(synBox);
  function drawSyn(){
    synBox.innerHTML='';
    synBox.append(h('b',{},'Sinonīmi testos'));
    const cb=h('input',{type:'checkbox'});cb.checked=S.synBtn!==false;cb.onchange=()=>{S.synBtn=cb.checked;save();};
    synBox.append(h('p',{},h('label',{style:'font-size:17px'},cb,' Rādīt pogu "✔ Mana atbilde ir pareiza" pēc kļūdainas atbildes')));
    const items=[];
    Object.values(S.cards).forEach(c=>{(c.alt||[]).forEach(x=>items.push({c,k:'alt',x}));(c.alen||[]).forEach(x=>items.push({c,k:'alen',x}));});
    if(!items.length){synBox.append(h('p',{class:'sub'},'Pievienotu sinonīmu vēl nav.'));return;}
    synBox.append(h('p',{class:'sub'},'Pievienotie sinonīmi ('+items.length+'). Spied ✕, lai dzēstu tikai konkrēto:'));
    items.forEach(({c,k,x})=>synBox.append(h('div',{class:'row',style:'justify-content:space-between;align-items:center'},
      h('span',{style:'font-size:17px'},k==='alt'?c.en+' → '+x+'  (oriģināls: '+c.lv+')':c.lv+' → '+x+'  (oriģināls: '+c.en+')'),
      h('button',{class:'b alt',style:'padding:6px 12px',onclick:()=>{c[k]=c[k].filter(y=>y!==x);if(!c[k].length)delete c[k];save();drawSyn();}},'✕'))));
    synBox.append(h('div',{class:'row'},h('button',{class:'b bad',onclick:()=>{if(confirm('Dzēst VISUS pievienotos sinonīmus visiem vārdiem?')){Object.values(S.cards).forEach(c=>{delete c.alt;delete c.alen;});save();drawSyn();}}},'Dzēst visus sinonīmus')));
  }
  drawSyn();
  app.append(h('div',{class:'box'},
    h('b',{},'Rezerves kopija'),
    h('p',{class:'sub'},'Progress glabājas šajā pārlūkā. Lai pārnestu uz telefonu vai citu datoru, eksportē un importē.'),
    h('div',{class:'row'},
      h('button',{class:'b',onclick:()=>{const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),download:'angļu-progress.json'});a.click();}},'⬇ Eksportēt'),
      h('button',{class:'b alt',onclick:()=>{try{const d=JSON.parse(ta.value);if(!d.cards)throw 0;S=d;save();alert('Atjaunots!');go('cards');}catch(e){alert('Nederīgs JSON');}}},'⬆ Importēt no lauka zemāk')),
    ta),
    h('div',{class:'box'},h('b',{},'Pievienot savu vārdu'),
      (()=>{const a=h('input',{type:'text',placeholder:'angliski'}),b=h('input',{type:'text',placeholder:'latviski',style:'margin-top:8px'});
       return h('div',{},a,b,h('div',{class:'row'},h('button',{class:'b',onclick:()=>{const en=norm(a.value),lv=b.value.trim();if(en&&lv){S.cards[en]={en,lv,ef:2.5,int:0,reps:0,due:0};save();a.value=b.value='';alert('Pievienots');}}},'Pievienot')));})()));
}

go('cards');
